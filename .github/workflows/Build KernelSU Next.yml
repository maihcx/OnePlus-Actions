        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "📤 Đang tải lên Telegram..."
            cd AnyKernel3
            zip -q -r "../${{ steps.set_name.outputs.ARTIFACT_NAME }}.zip" ./*
            cd ..
            pip3 install telebot
            python3 ./bot/script/buildbot.py "./${{ steps.set_name.outputs.ARTIFACT_NAME }}.zip"
